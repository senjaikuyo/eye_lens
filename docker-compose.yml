services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: eyelens
    container_name: eyelens_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - APP_KEY=${APP_KEY:-base64:sSdt1T7IFpltj3EyVIxR9X/nZghG+a9caqqtUrn48+Y=}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=db_eyelens
      - DB_USERNAME=eyelens_app
      - DB_PASSWORD=eyelens123
      - MAIL_MAILER=${MAIL_MAILER:-log}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-hello@example.com}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-EyeLens}
    volumes:
      - ./backend:/var/www/html
    networks:
      - eyelens_network
    depends_on:
      - db

  webserver:
    image: nginx:alpine
    container_name: eyelens_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - eyelens_network
    depends_on:
      - app

  db:
    image: mariadb:10.11
    container_name: eyelens_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: db_eyelens
      MYSQL_USER: eyelens_app
      MYSQL_PASSWORD: eyelens123
      MYSQL_ROOT_PASSWORD: rootpassword123
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - eyelens_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: eyelens_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8080:80"
    networks:
      - eyelens_network
    depends_on:
      - db

volumes:
  dbdata:
    driver: local

networks:
  eyelens_network:
    driver: bridge
