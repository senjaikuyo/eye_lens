name: eye_lens
description: "EyeLens — pembaca teks dan TTS offline untuk low vision"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.5.4
  camera: ^0.12.0+1
  google_mlkit_text_recognition: ^0.16.0
  image_picker: ^1.2.2
  sqflite: ^2.4.2
  path: ^1.9.1
  flutter_tts: ^4.2.5
  path_provider: ^2.1.5
  http: ^1.6.0
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
